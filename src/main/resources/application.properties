spring.application.name=booking-api

# Läser in variabler från filen .env i projektroten (om den finns).
# Miljövariabler satta i terminalen ($env:...) har högre prioritet än .env.
spring.config.import=optional:file:.env[.properties]

# Porten styrs av miljövariabeln PORT, 8080 används om den saknas
server.port=${PORT:8080}

# Instansens namn styrs av INSTANCE_NAME, "local" används om den saknas
app.instance-name=${INSTANCE_NAME:local}

# Databasanslutning byggs ihop av miljövariabler
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bookingdb}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Hibernate skapar/uppdaterar tabellen automatiskt utifrån Booking-klassen
spring.jpa.hibernate.ddl-auto=update

# Skriver ut SQL-frågorna i konsolen, bra för att se vad som händer
spring.jpa.show-sql=true